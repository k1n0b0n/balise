# Defaults of host.yml, below any inventory's values (ansible/inventory/example.yml lists them).
image_repository: ghcr.io/k1n0b0n/balise
web_port: 8080
tls: true
manage_firewall: true
manage_upgrades: true
# Feed recordings (E5.1, ADR-0022), archived each night at that time in the network's zone: keep it clear of the
# host's own nightly maintenance (updates, reboots).
recordings: true
recordings_archive_at: "05:15"
