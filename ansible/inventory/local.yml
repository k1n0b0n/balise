# The local machines of scripts/local-server.sh (ADR-0020 point 9), with group_vars/local.yml. A real host gets its
# own inventory from example.yml, kept in ansible/local/, which Git ignores.
all:
  children:
    local:
      hosts:
        balise-debian.orb.local:
          domain: balise-debian.orb.local
        balise-ubuntu.orb.local:
          domain: balise-ubuntu.orb.local
        # Already runs Docker, nginx, another site and another container, which the bootstrap must leave alone.
        balise-shared.orb.local:
          domain: balise-shared.orb.local
          manage_firewall: false
