# Switches back to the release before the live one, still on disk (deploy.yml keeps three).
#   docker compose run --rm ansible ansible-playbook rollback.yml
- name: Roll balise back to the previous release
  hosts: all
  become: true
  vars_files:
    - ../versions.yaml
  vars:
    current: /var/www/balise

  tasks:
    - name: Read the live release
      ansible.builtin.stat:
        path: "{{ current }}"
      register: live

    - name: List the releases
      ansible.builtin.find:
        paths: /srv/balise/releases
        file_type: directory
      register: releases

    - name: Find the release before it
      ansible.builtin.set_fact:
        previous: "{{ older | last }}"
      vars:
        older: "{{ releases.files | map(attribute='path') | sort | select('lt', live.stat.lnk_source) | list }}"
      failed_when: older | length == 0

    # Migrations are not rolled back: they must stay compatible with the previous release.
    - name: Switch to the previous release
      ansible.builtin.file:
        path: "{{ current }}"
        src: "{{ previous }}"
        state: link
        force: true

    - name: Reload php-fpm, which empties OPcache
      ansible.builtin.systemd_service:
        name: "php{{ php }}-fpm"
        state: reloaded

    - name: Restart the workers on the previous release
      ansible.builtin.systemd_service:
        name: "balise-{{ item }}"
        state: restarted
      loop: [queue, scheduler]

    - name: Check that the site answers
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
