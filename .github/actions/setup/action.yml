name: Set up the test image
description: Loads the test image from the cache the `image` job filled, then installs dependencies in it.
inputs:
  composer:
    description: Install Composer packages, generate the GTFS-Realtime classes and create .env
    default: 'true'
  npm:
    description: Install npm packages
    default: 'false'
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/php/Dockerfile
        target: test
        tags: balise-php:test
        load: true
        cache-from: type=gha,scope=test

    - if: inputs.composer == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/composer
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - if: inputs.composer == 'true'
      uses: ./.github/actions/run
      with:
        command: composer install --no-interaction --no-progress

    # Generated classes are not committed (ADR-0015); the script pins protoc and checks its SHA-256.
    - if: inputs.composer == 'true'
      id: gtfs-realtime-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: generated
        key: gtfs-realtime-${{ hashFiles('scripts/generate-gtfs-realtime.sh', 'proto/gtfs-realtime.proto') }}

    - if: inputs.composer == 'true' && steps.gtfs-realtime-cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/run
      with:
        command: sh scripts/generate-gtfs-realtime.sh

    - if: inputs.composer == 'true'
      uses: ./.github/actions/run
      with:
        command: cp .env.example .env && php artisan key:generate --no-interaction

    - if: inputs.npm == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/npm
        key: npm-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-

    - if: inputs.npm == 'true'
      uses: ./.github/actions/run
      with:
        command: npm ci
