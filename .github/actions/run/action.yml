name: Run in the test image
description: Runs a command in the compose service `test`, as the runner's user so that files written to the checkout stay its own.
inputs:
  command:
    description: Shell command
    required: true
  database:
    description: Start PostgreSQL from compose.yaml first
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        DEPS: ${{ inputs.database == 'true' && '' || '--no-deps' }}
      run: >-
        docker compose run --rm $DEPS --user "$(id -u):$(id -g)"
        -e HOME=/tmp -e COMPOSER_CACHE_DIR=.cache/composer -e npm_config_cache=.cache/npm
        test sh -c "$COMMAND"
