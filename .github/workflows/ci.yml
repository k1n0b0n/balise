name: CI

# Every check runs in the images of compose.yaml, with PostgreSQL from it too (ADR-0020): what CI proves is what
# the stack runs, and each version is written in one place. Only the browser tests need the Debian test image.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only docs/ skips every job below; the required `ci` check still reports, green.
  # AGENTS.md and README.md are outside docs/: the version raise's tests read them. A push to main runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A file moved into docs/ counts by its old path too. The API lists 3,000 files at most: a list shorter than
          # the pull request's count of changed files proves nothing, so everything runs.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | "\(.filename)\t\(.previous_filename // "")"')
          listed=$(grep -c . <<< "$files" || true)
          if [ "$listed" -lt "$CHANGED" ] || tr '\t' '\n' <<< "$files" | grep . | grep -qv '^docs/'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # Builds each image once and fills the cache the other jobs load it from.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        target: [dev, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: ${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  style:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/run
        with:
          command: vendor/bin/pint --test

  static:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/run
        with:
          command: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Feature tests render pages, which read the Vite manifest of the front job.
  tests:
    needs: front
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: public/build
      - uses: ./.github/actions/run
        with:
          database: 'true'
          command: vendor/bin/pest --testsuite=Unit,Feature

  front:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite bundles Livewire's script from vendor/.
      - uses: ./.github/actions/setup
        with:
          npm: 'true'
      - uses: ./.github/actions/run
        with:
          service: vite
          command: npm run typecheck && npm run build && npm run budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: public/build
          retention-days: 1

  # Browser tests (axe) need the built assets too.
  browser:
    needs: front
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          target: test
          npm: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: public/build
      # One after the other: the map's WebGL is drawn by the CPU, and browsers in parallel on the runner's four vCPUs
      # either made Playwright calls exceed their 5 s limit (four processes) or saved nothing (two).
      - uses: ./.github/actions/run
        with:
          service: test
          database: 'true'
          command: vendor/bin/pest --testsuite=Browser

  audit:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          composer: 'false'
      - uses: ./.github/actions/run
        with:
          command: composer audit --locked
      - uses: ./.github/actions/run
        with:
          service: vite
          command: npm audit --audit-level=high

  # The only required check: a job skipped or cancelled above fails it too, unless only docs/ changed.
  ci:
    needs: [changes, style, static, tests, front, browser, audit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1
