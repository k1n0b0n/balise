# Local development and CI (ADR-0007, ADR-0020). Production runs the same images from its own compose file.
name: balise

# PHP image targets (docker/php/Dockerfile): runtime for the workers, dev for the app and tools, test for the browser tests.
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: balise-php:dev
  volumes:
    - .:/var/www/balise
  environment:
    LOG_CHANNEL: stderr
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  setup:
    image: balise-php:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - .:/var/www/balise
    command: ["docker/php/setup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  php:
    <<: *php

  queue:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
    image: balise-php:runtime
    command: ["php", "artisan", "queue:work", "--tries=3"]

  scheduler:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: runtime
    image: balise-php:runtime
    command: ["php", "artisan", "schedule:work"]

  # Quality gates with browser tests, on demand: `docker compose run --rm test`.
  test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: test
    image: balise-php:test
    profiles: ["test"]
    volumes:
      - .:/var/www/balise
    depends_on:
      postgres:
        condition: service_healthy

  # Server playbooks (ADR-0019), on demand: `docker compose run --rm ansible ansible-playbook server.yml`.
  ansible:
    build:
      context: .
      dockerfile: ansible/Dockerfile
    image: balise-ansible
    profiles: ["ops"]
    volumes:
      - .:/var/www/balise

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: balise-nginx:dev
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/balise/public:ro
    depends_on:
      php:
        condition: service_started
        restart: true

  vite:
    image: node:24-alpine
    user: node
    working_dir: /var/www/balise
    volumes:
      - .:/var/www/balise
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balise
      POSTGRES_USER: balise
      POSTGRES_PASSWORD: balise
    volumes:
      # PostgreSQL 18 images keep their data under a versioned subdirectory of this path
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "balise"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine

volumes:
  postgres:
