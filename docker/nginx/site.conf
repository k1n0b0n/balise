# The site of the web image, locally and in production (ADR-0020).

# Answers of the positions endpoint, kept until the next version (E4.2): pages at the same version cost one PHP
# request per version, however many they are. In the container: lost on restart, bounded in size.
fastcgi_cache_path /var/cache/nginx/positions levels=1 keys_zone=positions:1m max_size=16m inactive=1m use_temp_path=off;

map $request_uri $not_positions {
    ~^/api/networks/[^/?]+/vehicles(\?|$) 0;
    default 1;
}

# PHP answers the positions in full; nginx itself sends the 304 to pages already up to date, from the kept answer.
map $not_positions $php_if_none_match {
    0 "";
    default $http_if_none_match;
}

# The image's format, with the cache's answer to each request (HIT, MISS, EXPIRED; BYPASS outside the positions).
log_format cached '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" $upstream_cache_status';

server {
    listen 80;
    access_log /var/log/nginx/access.log cached;
    server_tokens off;
    root /var/www/balise/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Text assets compressed (RGESN); the image's nginx.conf compresses nothing.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;
    # Level 6 rather than the default 1: the network shapes file is a fifth smaller (E3.8).
    gzip_comp_level 6;

    # Built assets have hashed names: cached for a year (ADR-0006).
    location /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # nginx's mime.types has no .mjs: MapLibre's worker would be refused as a script.
        location ~ \.mjs$ {
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # nginx writes its own Date: a kept answer would otherwise repeat PHP's, and pages count their wait from it.
        fastcgi_hide_header Date;

        fastcgi_cache positions;
        fastcgi_cache_key $request_uri;
        fastcgi_cache_bypass $not_positions;
        fastcgi_no_cache $not_positions;
        # Only PHP's X-Accel-Expires says how long to keep an answer; its Cache-Control is for browsers.
        fastcgi_ignore_headers Cache-Control Expires;
        # Pages asking at the same moment: one goes to PHP, the others wait for its answer.
        fastcgi_cache_lock on;
        fastcgi_param HTTP_IF_NONE_MATCH $php_if_none_match;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
