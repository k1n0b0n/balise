# Shared with the production server (ADR-0007), where Ansible adds server_name and log paths.
server {
    listen 80;
    server_tokens off;
    root /var/www/balise/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Text assets compressed (RGESN); Ubuntu's nginx.conf only compresses HTML.
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Built assets have hashed names: cached for a year (ADR-0006).
    location /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Ubuntu's mime.types has no .mjs: MapLibre's worker would be refused as a script.
        location ~ \.mjs$ {
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
